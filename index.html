<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile Page Editor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--blue:#2340ff;--blue-soft:#e9ecff;--ink:#0b0b10;--mute:#8d8d99;--line:#e3e4ec;--bg:#f4f5f9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Pretendard',-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;font-size:14px;line-height:1.5}
button{font:inherit;cursor:pointer}

/* top bar */
.bar{height:58px;flex:none;display:flex;align-items:center;gap:16px;padding:0 18px;background:#fff;border-bottom:1px solid var(--line)}
.brand{font-size:12px;letter-spacing:.2em;font-weight:800;white-space:nowrap}
.brand b{color:var(--blue)}
.bar-mid{display:flex;gap:10px;margin:0 auto}
.seg{display:flex;border:1.5px solid var(--ink)}
.seg button{border:0;background:#fff;font-weight:800;font-size:12px;letter-spacing:.1em;padding:7px 14px}
.seg button.on{background:var(--ink);color:#fff}
.seg-lb{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--mute);align-self:center}
.bar-r{display:flex;align-items:center;gap:8px}
.status{font-size:12px;color:var(--mute);margin-right:4px;white-space:nowrap}
.btn{font-weight:800;font-size:13px;padding:9px 14px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#1a31d6}
.btn.warn{border-color:#d33;color:#d33}

/* layout */
.layout{flex:1;min-height:0;display:grid;grid-template-columns:480px 1fr}
.panel{display:flex;flex-direction:column;min-height:0;background:#fff;border-right:1px solid var(--line)}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;border:0;background:#fff;padding:14px 6px;font-weight:800;font-size:13px;color:var(--mute);border-bottom:3px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--blue)}
.form{overflow:auto;padding:18px;flex:1}
.stage{min-height:0;display:flex;justify-content:center;padding:18px;overflow:auto}
.frame{width:100%;height:100%;background:#fff;box-shadow:0 8px 40px rgba(20,20,60,.12);transition:width .3s}
.frame.mobile{width:390px;flex:none}
iframe{width:100%;height:100%;border:0;display:block}

/* form parts */
.tip{background:var(--blue-soft);color:#1b2fb8;padding:12px 14px;font-size:13px;margin-bottom:14px;line-height:1.6}
details{border:1px solid var(--line);margin-bottom:14px;background:#fff}
summary{padding:13px 14px;font-weight:800;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";color:var(--blue);font-weight:800}
details[open] > summary::after{content:"－"}
details[open] > summary{border-bottom:1px solid var(--line)}
.in{padding:14px}
.f{display:block;margin-bottom:12px}
.lb{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--mute);margin-bottom:5px}
input[type=text],textarea,select{width:100%;border:1px solid #d6d7e2;padding:9px 10px;font:inherit;background:#fff;color:var(--ink);border-radius:0}
textarea{resize:vertical;line-height:1.55}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.sub{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--blue);margin:18px 0 8px}
.list{display:grid;gap:10px}
.li{border:1px solid var(--line);border-left:3px solid var(--blue);padding:10px 12px;background:#fafbff}
.li-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px}
.acts{display:flex;gap:4px}
.mini{width:26px;height:26px;border:1px solid #d6d7e2;background:#fff;font-size:12px;font-weight:800}
.mini:hover{border-color:var(--blue);color:var(--blue)}
.add{border:1.5px dashed var(--blue);background:#fff;color:var(--blue);font-weight:800;padding:9px;font-size:13px}
.add:hover{background:var(--blue-soft)}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.row2{display:grid;grid-template-columns:110px 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;white-space:nowrap}
.meter{display:grid;grid-template-columns:90px 1fr 34px;gap:10px;align-items:center}
.meter input[type=range]{width:100%;accent-color:var(--blue)}
.out{text-align:right;font-weight:800;font-size:13px}
.img{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:start}
.thumb{width:72px;height:90px;background:var(--bg) center/cover no-repeat;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mute);text-align:center}
.img .btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.sbtn{border:1.5px solid var(--ink);background:#fff;font-weight:800;font-size:12px;padding:6px 10px}
.sbtn.blue{border-color:var(--blue);color:var(--blue)}
.hint{font-size:11px;color:var(--mute);margin-top:4px}

@media (max-width:960px){
  body{height:auto;min-height:100%}
  .bar{flex-wrap:wrap;height:auto;padding:10px 14px}
  .bar-mid{margin:0}
  .layout{grid-template-columns:1fr;grid-template-rows:auto 80vh}
  .panel{border-right:0;border-bottom:1px solid var(--line)}
  .form{max-height:70vh}
}
</style>
</head>
<body>

<header class="bar">
  <div class="brand"><b>PROFILE PAGE</b> EDITOR</div>
  <div class="bar-mid">
    <span class="seg-lb">화면</span>
    <div class="seg" id="segDevice"><button data-d="desktop" class="on">PC</button><button data-d="mobile">모바일</button></div>
    <span class="seg-lb">미리보기</span>
    <div class="seg" id="segMode"><button data-m="off" class="on">OFF</button><button data-m="on">ON</button></div>
  </div>
  <div class="bar-r">
    <span class="status" id="status">자동 저장됨</span>
    <button class="btn" id="btnLoad" title="저장해 둔 JSON 불러오기">불러오기</button>
    <button class="btn" id="btnSave" title="편집 내용을 JSON으로 저장">JSON 저장</button>
    <button class="btn warn" id="btnReset">초기화</button>
    <button class="btn" id="btnImage" title="페이지 전체를 이미지(PNG)로 저장">이미지 저장</button>
    <button class="btn" id="btnCopy">HTML 복사</button>
    <button class="btn primary" id="btnExport">HTML 내보내기</button>
  </div>
</header>

<div class="layout">
  <aside class="panel">
    <nav class="tabs" id="tabs"></nav>
    <div class="form" id="form"></div>
  </aside>
  <section class="stage">
    <div class="frame" id="frame"><iframe id="preview" title="미리보기"></iframe></div>
  </section>
</div>
<input type="file" id="fileJson" accept=".json,application/json" hidden>

<!-- ================= 내보내기용 뷰어 템플릿 (편집기 화면에는 영향 없음) ================= -->
<script type="text/plain" id="v-css">
:root{
  --blue:#2340ff;--blue-text:#2340ff;--blue-soft:#e9ecff;--bg:#ffffff;--card:#ffffff;--ink:#0b0b10;
  --text:#4a4a55;--mute:#8d8d99;--line:#e6e6ec;--focus:#2340ff;--tag-k-bg:#0b0b10;--tag-k-fg:#ffffff;--fade:rgba(255,255,255,.85);
}
body[data-mode="on"]{
  --blue-text:#7d92ff;--blue-soft:#161a3c;--bg:#0c0d12;--card:#12131a;--ink:#ffffff;--text:#b4b5c0;
  --mute:#7c7d8b;--line:#252631;--focus:#ffffff;--tag-k-bg:#ffffff;--tag-k-fg:#0c0d12;--fade:rgba(12,13,18,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Pretendard',-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.7;transition:background .45s ease,color .45s ease}
.wrap{max-width:1120px;margin:0 auto}

.switch{position:fixed;top:16px;right:16px;z-index:50;width:108px;height:42px;border-radius:999px;cursor:pointer;border:1.5px solid var(--ink);background:var(--bg);color:var(--mute);font:inherit;font-size:12px;font-weight:800;letter-spacing:.16em;transition:background .45s,border-color .45s}
.switch .lab{position:absolute;top:50%;transform:translateY(-50%)}
.switch .l-off{left:16px}
.switch .l-on{right:18px}
.switch .knob{position:absolute;top:3px;left:3px;width:54px;height:33px;border-radius:999px;background:#2340ff;color:#fff;display:flex;align-items:center;justify-content:center;transition:transform .35s cubic-bezier(.3,.9,.3,1);box-shadow:0 2px 10px rgba(35,64,255,.35)}
.switch[aria-checked="true"] .knob{transform:translateX(46px)}
.switch:focus-visible{outline:3px solid #2340ff;outline-offset:3px}

.sec-head{padding:78px 32px 8px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.24em;color:var(--blue-text);transition:color .45s}
.sec-head h2{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.25;margin-top:8px}
.sec-head p{color:var(--text);margin-top:8px;font-size:15px}
.tl-head .sec-head{padding-top:56px}
.tl-head{border-top:1px solid var(--line);margin-top:32px;transition:border-color .45s}

.profiles{display:flex;flex-direction:column;gap:28px;padding:28px 32px 16px}
.card{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border:1px solid var(--line);background:var(--card);transition:background .45s,border-color .45s}
.card.rev .photo{order:2}
.card.swap{animation:swapIn .5s ease}
@keyframes swapIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.photo{position:relative;aspect-ratio:4/5;overflow:hidden;background:linear-gradient(160deg,#9fe7ee 0%,#c9c4f2 38%,#f6d3e4 78%,#f3f3f8 100%)}
.photo.alt{background:linear-gradient(160deg,#cfd6ff 0%,#b9b1ee 40%,#f1d6e3 80%,#f3f3f8 100%)}
.photo.pg{background:radial-gradient(60% 40% at 15% 20%,rgba(190,205,120,.9),transparent 70%),radial-gradient(55% 45% at 85% 30%,rgba(150,170,80,.85),transparent 70%),linear-gradient(170deg,#7d8a4e 0%,#a6a98a 45%,#4e4a3c 100%)}
.photo.pg2{background:radial-gradient(60% 40% at 80% 20%,rgba(120,150,210,.85),transparent 70%),radial-gradient(55% 45% at 15% 35%,rgba(90,80,160,.8),transparent 70%),linear-gradient(170deg,#4b5a8a 0%,#7d7aa6 45%,#2e2c46 100%)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:120px;font-weight:800;color:rgba(255,255,255,.6);letter-spacing:-.05em}
.photo::after{content:"";position:absolute;inset:auto 0 0 0;height:30%;background:linear-gradient(to top,var(--fade),transparent)}
.focus{position:absolute;left:18%;top:20%;width:60%;height:38%;border:1.5px solid var(--focus);z-index:2;transition:border-color .45s}
.focus i{position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--focus)}
.focus i:nth-child(1){left:-8px;top:-8px}
.focus i:nth-child(2){right:-8px;top:-8px}
.focus i:nth-child(3){left:-8px;bottom:-8px}
.focus i:nth-child(4){right:-8px;bottom:-8px}
.x{position:absolute;color:#2340ff;font-weight:800;font-size:16px;z-index:2}
.badge{position:absolute;left:14px;top:12px;z-index:3;font-size:11px;font-weight:800;letter-spacing:.18em;display:flex;align-items:center;gap:8px;color:var(--ink)}
.badge::before{content:"";width:9px;height:9px;border-radius:50%;background:#2340ff}
.side{position:absolute;right:10px;top:55%;z-index:3;writing-mode:vertical-rl;font-size:11px;font-weight:800;letter-spacing:.3em;color:var(--ink)}
.nameplate{position:absolute;left:0;bottom:44px;z-index:3;background:#2340ff;color:#fff;font-size:24px;font-weight:800;padding:10px 22px 10px 20px;letter-spacing:-.02em}
.bars{position:absolute;left:0;bottom:22px;z-index:3}
.bars span{display:block;height:5px;background:#2340ff;margin-top:5px}
.bars span:nth-child(1){width:54px}.bars span:nth-child(2){width:34px}
.info{display:flex;flex-direction:column}
.body{padding:28px 30px 8px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;font-weight:800;padding:6px 14px;background:var(--tag-k-bg);color:var(--tag-k-fg);letter-spacing:.04em;transition:background .45s,color .45s}
.tag.b{background:#2340ff;color:#fff}
.qmark{color:#2340ff;font-size:44px;font-weight:800;line-height:1;margin:18px 0 0;font-family:Georgia,serif}
.quote{font-size:25px;font-weight:800;letter-spacing:-.035em;line-height:1.4;margin-top:4px;white-space:pre-line}
.desc{color:var(--text);font-size:14.5px;margin-top:14px}
.desc p+p{margin-top:12px}
.spec{margin:22px 30px 30px;border-top:1px solid var(--line);margin-top:auto}
.spec div{display:grid;grid-template-columns:96px 1fr;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.spec dt{font-size:11px;font-weight:800;letter-spacing:.2em;color:var(--mute)}
.spec dd{font-weight:700;font-size:15px}
.body + .spec{margin-top:22px}

.rel{padding-bottom:24px}
.rel-grid{display:grid;grid-template-columns:1fr 64px 1fr;padding:28px 32px 0;align-items:stretch}
.rel-card{border:1px solid var(--line);background:var(--card);padding:26px 26px 24px;display:flex;flex-direction:column;transition:background .45s,border-color .45s}
.rel-card.A{border-top:4px solid #2340ff}
.rel-card.B{border-top:4px solid var(--ink)}
.rel-who{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff;background:#2340ff;flex:none}
.rel-card.B .av{background:var(--ink);color:var(--bg)}
.rel-who .cap{font-size:15px;font-weight:800;letter-spacing:-.01em;line-height:1.3}
.rel-who .sub{font-size:11px;font-weight:800;letter-spacing:.2em;color:var(--mute)}
.rel-quote{font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.45;white-space:pre-line}
.rel-card .desc{margin-bottom:16px}
.meters{margin-top:auto;padding-top:20px;border-top:1px solid var(--line);display:grid;gap:10px}
.m{display:grid;grid-template-columns:56px 1fr 34px;gap:10px;align-items:center;font-size:12px;font-weight:800;color:var(--mute)}
.m .bar{height:6px;background:var(--line)}
.m .bar i{display:block;height:100%;background:#2340ff}
.rel-card.B .m .bar i{background:var(--ink)}
.m .v{text-align:right;color:var(--ink)}
.rel-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.rel-mid .ln{flex:1;width:2px;background:var(--line)}
.rel-mid .ico{width:44px;height:44px;border-radius:50%;border:2px solid #2340ff;display:flex;align-items:center;justify-content:center;color:var(--blue-text);background:var(--bg);font-size:18px;font-weight:800}
.rel-sum{margin:20px 32px 0;background:#2340ff;color:#fff;padding:20px 26px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.rel-sum .lb{font-size:11px;font-weight:800;letter-spacing:.22em;color:#cfd6ff;white-space:nowrap}
.rel-sum .tx{font-size:20px;font-weight:800;letter-spacing:-.02em}

.controls{display:flex;gap:8px;padding:20px 32px 0;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;font-weight:800;letter-spacing:.08em;padding:9px 18px;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink);transition:.2s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip.cb{border-color:var(--blue-text);color:var(--blue-text)}
.chip.cb[aria-pressed="true"]{background:#2340ff;border-color:#2340ff;color:#fff}
.timeline{position:relative;padding:40px 32px 80px}
.timeline::before{content:"";position:absolute;left:50%;top:40px;bottom:80px;width:2px;background:var(--line);transform:translateX(-1px);transition:background .45s}
.lanes{display:flex;justify-content:space-between;font-size:12px;font-weight:800;letter-spacing:.2em;margin-bottom:28px}
.lanes .a{color:var(--blue-text)} .lanes .b{color:var(--ink)}
.ev{position:relative;width:calc(50% - 36px);margin-bottom:26px;border:1px solid var(--line);padding:18px 20px;background:var(--card);transition:background .45s,border-color .45s}
.ev.A{border-left:4px solid #2340ff}
.ev.B{margin-left:auto;border-left:4px solid var(--ink)}
.ev::after{content:"";position:absolute;top:24px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid #2340ff}
.ev.A::after{right:-45px}
.ev.B::after{left:-45px;border-color:var(--ink)}
.ev .when{font-size:11px;font-weight:800;letter-spacing:.2em;color:var(--blue-text)}
.ev.B .when{color:var(--ink)}
.ev h3{font-size:18px;font-weight:800;letter-spacing:-.02em;margin-top:2px;line-height:1.4}
.ev p{font-size:14px;color:var(--text);margin-top:6px;white-space:pre-line}
.ev .link{display:inline-block;margin-top:10px;font-size:11px;font-weight:800;letter-spacing:.12em;background:var(--blue-soft);color:var(--blue-text);padding:3px 9px}
.ev.hide{display:none}
.ev.meet{width:100%;margin:0 0 26px 0;border:1.5px solid #2340ff;background:#2340ff;color:#fff;text-align:center;padding:22px 20px}
.ev.meet::after{left:50%;right:auto;top:-8px;transform:translateX(-50%);background:#2340ff;border-color:#fff}
.ev.meet .when{color:#cfd6ff}
.ev.meet h3{color:#fff}
.ev.meet p{color:#e6eaff}
.ev.meet .link{background:rgba(255,255,255,.18);color:#fff}

footer{padding:28px 32px 48px;border-top:1px solid var(--line);font-size:12px;color:var(--mute);letter-spacing:.08em;transition:border-color .45s}

@media (max-width:820px){
  .profiles{padding:20px 16px;gap:20px}
  .card{grid-template-columns:1fr}
  .card.rev .photo{order:0}
  .body{padding:24px 24px 8px}
  .spec{margin:22px 24px 24px}
  .sec-head,.controls{padding-left:16px;padding-right:16px}
  .sec-head{padding-top:76px}
  .tl-head .sec-head{padding-top:48px}
  .sec-head h2{font-size:28px}
  .timeline{padding:32px 16px 60px}
  .timeline::before{left:24px}
  .lanes{display:none}
  .rel-grid{grid-template-columns:1fr;padding:20px 16px 0}
  .rel-mid{flex-direction:row;padding:10px 0}
  .rel-mid .ln{height:2px;width:auto}
  .rel-sum{margin:16px 16px 0;padding:18px}
  .rel-sum .tx{font-size:17px}
  .ev,.ev.B,.ev.meet{width:calc(100% - 44px);margin-left:44px}
  .ev.A::after,.ev.B::after{left:-27px;right:auto}
  .ev.meet::after{left:-27px;transform:none;top:24px}
  .ev.meet{text-align:left}
  footer{padding-left:16px;padding-right:16px}
}
</script>

<script type="text/plain" id="v-body">
<button class="switch" id="switch" role="switch" aria-checked="false" aria-label="OFF / ON 전환">
  <span class="lab l-off">OFF</span>
  <span class="lab l-on">ON</span>
  <span class="knob" id="knob">OFF</span>
</button>
<main class="wrap">
  <section id="sec-prof">
    <div class="sec-head">
      <div class="eyebrow" id="eyebrow"></div>
      <h2 id="t-prof-h"></h2>
      <p id="t-prof-p"></p>
    </div>
    <div class="profiles" id="profiles"></div>
  </section>
  <section class="tl-head rel" id="sec-rel">
    <div class="sec-head">
      <div class="eyebrow" id="t-rel-e"></div>
      <h2 id="t-rel-h"></h2>
      <p id="t-rel-p"></p>
    </div>
    <div class="rel-grid" id="relGrid"></div>
    <div class="rel-sum" id="relSum"></div>
  </section>
  <section class="tl-head" id="sec-tl">
    <div class="sec-head">
      <div class="eyebrow" id="t-tl-e"></div>
      <h2 id="t-tl-h"></h2>
      <p id="t-tl-p"></p>
    </div>
    <div class="controls" id="controls"></div>
    <div class="timeline">
      <div class="lanes"><span class="a" id="laneA"></span><span class="b" id="laneB"></span></div>
      <div id="events"></div>
    </div>
  </section>
</main>
<footer id="footer"></footer>
</script>

<script type="text/plain" id="v-js">
(function(){
  const IN_EDITOR = window.parent !== window;
  let DATA = window.__DATA__ || {};
  let mode = 'off';
  let filter = 'ALL';
  const $ = s => document.querySelector(s);

  function card(m, i, c, animate){

      : `<div class="ph">${esc(String(c.name || '').slice(0,1))}</div>`;

    }
  });

  if(!IN_EDITOR){ try{ if(localStorage.getItem('profile-mode') === 'on') mode = 'on'; }catch(e){} }
  renderAll(false);
})();
</script>

/* ---------- 폼 빌더 ---------- */
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs || {})){
    if(k === 'class') e.className = v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if(v !== false && v != null) e.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if(c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(c)); });
  return e;
}
const get = p => p.reduce((o,k) => o[k], S);
function setv(p, v){ get(p.slice(0,-1))[p[p.length-1]] = v; changed(); }

function INP(path, ph){
  const el = h('input', {type:'text', placeholder: ph || ''});
  el.value = get(path) == null ? '' : get(path);
  el.addEventListener('input', () => setv(path, el.value));
  return el;
}
function F(label, path, o){
  o = o || {};
  let el;
  if(o.area){
    el = h('textarea', {rows: o.rows || 3});
    el.value = get(path) == null ? '' : get(path);
    el.addEventListener('input', () => setv(path, el.value));
  } else el = INP(path, o.ph);
  return h('label', {class:'f'}, h('span', {class:'lb'}, label), el, o.hint ? h('div', {class:'hint'}, o.hint) : null);
}
function CSV(label, path, hint){
  const el = h('input', {type:'text'});
  el.value = (get(path) || []).join(', ');
  el.addEventListener('input', () => setv(path, el.value.split(',').map(s => s.trim()).filter(Boolean)));
  return h('label', {class:'f'}, h('span', {class:'lb'}, label), el, h('div', {class:'hint'}, hint || '쉼표(,)로 구분해서 입력'));
}
function SEL(label, path, opts){

function mini(t, fn){ return h('button', {class:'mini', type:'button', onclick:fn}, t); }
function LIST(o){

/* 이미지 업로드 (자동 리사이즈 → base64) */
function fileToDataURL(file, max){
  max = max || 1400;
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', .88));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function IMG(path){
  const cur = get(path) || '';
  const isData = cur.startsWith('data:');
  const thumb = h('div', {class:'thumb'}, cur ? '' : '사진 없음');
  if(cur) thumb.style.backgroundImage = 'url("' + cur.replace(/"/g,'%22') + '")';
  const file = h('input', {type:'file', accept:'image/*', hidden:true});
  file.addEventListener('change', async () => {
    const f = file.files[0]; if(!f) return;
    try{ const url = await fileToDataURL(f); setv(path, url); structural(); flash('사진을 넣었어요'); }
    catch(e){ flash('이미지를 읽지 못했어요'); }
  });
  const kb = isData ? Math.round(cur.length * .75 / 1024) : 0;
  const url = h('input', {type:'text', placeholder:'또는 이미지 주소(URL) 붙여넣기'});
  url.value = isData ? '' : cur;
  url.addEventListener('change', () => { setv(path, url.value.trim()); structural(); });
  return h('div', {class:'f'},
    h('span', {class:'lb'}, '사진'),
    h('div', {class:'img'}, thumb,
      h('div', {},
        h('div', {class:'btns'},
          h('button', {class:'sbtn blue', type:'button', onclick:() => file.click()}, cur ? '사진 바꾸기' : '사진 올리기'),
          cur ? h('button', {class:'sbtn', type:'button', onclick:() => { setv(path, ''); structural(); }}, '삭제') : null),
        url,
        h('div', {class:'hint'}, isData ? `내장 이미지 · 약 ${kb}KB (HTML 안에 함께 저장돼요)` : '사진이 없으면 그라데이션 + 이름 첫 글자로 표시돼요.')),
      file));
}

<script>
/* ---------- 이미지 저장 (화면 공유 없이, 페이지를 그대로 PNG로 변환) ---------- */
(function(){
  const btn = document.getElementById('btnImage');
  const statusEl = document.getElementById('status');
  const LIB = 'https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js';
  const FONT_CSS = 'https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css';
  const WEIGHTS = ['400','700','800'];          /* 페이지에서 실제로 쓰는 굵기만 내장 */
  const wait = ms => new Promise(r => setTimeout(r, ms));
  let busy = false, fontCache = null, warned = false;

  function say(m){ statusEl.textContent = m; }
  function done(m){ say(m); setTimeout(() => { statusEl.textContent = '자동 저장됨'; }, 3600); }

  function toDataURL(blob){
    return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); });
  }

  /* Pretendard 폰트를 이미지 안에 직접 심어서, 글꼴이 바뀌거나 깨지지 않게 함 */
  async function buildFontCSS(){
    if(fontCache !== null) return fontCache;
    let out = '';
    try{
      const css = await (await fetch(FONT_CSS)).text();
      const blocks = css.match(/@font-face\s*\{[^}]*\}/g) || [];
      for(const b of blocks){
        const w = (b.match(/font-weight\s*:\s*(\d+)/) || [])[1];
        if(!WEIGHTS.includes(w)) continue;
        const m = b.match(/url\(\s*['"]?([^'")]+?\.woff2)['"]?\s*\)/) || b.match(/url\(\s*['"]?([^'")]+?)['"]?\s*\)/);
        if(!m) continue;
        const blob = await (await fetch(new URL(m[1], FONT_CSS).href)).blob();
        out += "@font-face{font-family:'Pretendard';font-weight:" + w + ";font-style:normal;src:url(" + await toDataURL(blob) + ");}\n";
      }
    }catch(e){ console.warn('font embed failed', e); out = ''; }
    fontCache = out;
    return out;
  }

  function loadLib(win, doc){
    if(win.htmlToImage) return Promise.resolve();
    return new Promise((res, rej) => {
      const s = doc.createElement('script');
      s.src = LIB; s.onload = () => res(); s.onerror = () => rej(new Error('lib'));
      doc.head.append(s);
    });
  }

  async function save(){
    if(busy) return;
    busy = true; btn.disabled = true;
    const iframe = document.getElementById('preview');
    let idoc = null, root = null, oldBehavior = '', oldY = 0;
    try{
      const win = iframe.contentWindow; idoc = iframe.contentDocument; root = idoc.documentElement;
      say('이미지 준비 중…');
      await loadLib(win, idoc);
      const fontCSS = await buildFontCSS();
      if(!fontCSS && !warned){ warned = true; alert('폰트를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.\n이번 이미지는 글꼴이 다르게 나올 수 있어요.'); }

      oldBehavior = root.style.scrollBehavior; root.style.scrollBehavior = 'auto';
      oldY = win.scrollY; win.scrollTo(0, 0);
      idoc.querySelectorAll('.card.swap').forEach(c => c.classList.remove('swap'));   /* 등장 애니메이션이 첫 프레임(투명)으로 찍히는 것 방지 */
      if(idoc.fonts && idoc.fonts.ready) await idoc.fonts.ready;
      await wait(300);

      const body = idoc.body;
      const cw = root.clientWidth, H = Math.max(root.scrollHeight, body.scrollHeight);
      let pr = Math.min(2, 16000 / H, Math.sqrt(120e6 / (cw * H)));
      pr = Math.max(0.25, pr);
      const bg = win.getComputedStyle(body).backgroundColor || '#ffffff';
      const opt = {
        width: cw, height: H, pixelRatio: pr, backgroundColor: bg,
        fontEmbedCSS: fontCSS, cacheBust: false,
        style: { margin: '0', transition: 'none', animation: 'none' },
        filter: n => !(n.id === 'switch')            /* 고정 OFF/ON 스위치는 제외 */
      };
      const h2i = win.htmlToImage;
      await h2i.toCanvas(body, Object.assign({}, opt, { pixelRatio: 0.2 }));   /* 워밍업: 폰트·이미지 미리 디코딩 */
      say('이미지 만드는 중…');
      const cv = await h2i.toCanvas(body, opt);
      const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
      if(!blob) throw new Error('blob');

      const a = document.createElement('a');
      const dev = document.querySelector('#segDevice button.on');
      const mode = document.querySelector('#segMode button.on');
      a.href = URL.createObjectURL(blob);
      a.download = 'profile-page-' + (mode ? mode.dataset.m : 'off') + '-' + (dev ? dev.dataset.d : 'desktop') + '.png';
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      done('이미지를 저장했어요' + (pr < 2 ? ' (크기가 커서 해상도 낮춤)' : ''));
    }catch(e){
      console.error(e);
      done(e && e.message === 'lib' ? '이미지 도구를 불러오지 못했어요 (인터넷 확인)' : '이미지 저장에 실패했어요');
    }finally{
      try{ if(root){ root.style.scrollBehavior = oldBehavior; iframe.contentWindow.scrollTo(0, oldY); } }catch(_){}
      busy = false; btn.disabled = false;
    }
  }
  btn.addEventListener('click', save);
})();
</script>
